# yaml-language-server: $schema=../../serverless/reference.json

# Exercises `custom.prune` (serverless-prune-plugin) — every documented option.

service: prune-plugin-fixture
frameworkVersion: "4"

plugins:
  - serverless-prune-plugin

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: dev

custom:
  prune:
    automatic: true
    number: 3
    includeLayers: true

functions:
  hello:
    handler: src/hello.handler
