# yaml-language-server: $schema=../serverless/reference.json

# Exercises the `plugins` block (array form and `{localPath, modules}` form),
# the `custom` block with every supported plugin config, and the
# `stepFunctions` block from the step-functions plugin.

service: plugins-custom-fixture
frameworkVersion: "4"

# Plugins — array form
plugins:
  - serverless-esbuild
  - serverless-prune-plugin
  - serverless-step-functions
  - serverless-plugin-split-stacks
  - serverless-webpack
  - serverless-python-requirements
  - serverless-wsgi
  - serverless-ssm-publish

# Plugins — local + modules form (alternative)
# plugins:
#   localPath: ./.serverless/plugins
#   modules:
#     - my-local-plugin

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: dev

custom:
  # serverless-esbuild
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node20
    platform: node
    external:
      - "@aws-sdk/*"
    packager: npm
    keepOutputDirectory: false

  # serverless-webpack
  webpack:
    webpackConfig: webpack.config.js
    includeModules:
      forceExclude:
        - aws-sdk
    packager: npm

  # serverless-prune-plugin
  prune:
    automatic: true
    number: 3

  # serverless-plugin-split-stacks
  splitStacks:
    perFunction: false
    perType: true
    perGroupFunction: false

  # serverless-python-requirements
  pythonRequirements:
    dockerizePip: non-linux
    layer: true
    slim: true
    pythonBin: python3
    pipCmdExtraArgs:
      - --no-cache-dir

  # serverless-wsgi
  wsgi:
    app: app.application
    packRequirements: false
    pythonBin: python3

  # serverless-ssm-publish
  ssmPublish:
    enabled: true
    params:
      - path: /myapp/${sls:stage}/api-url
        value: https://api.example.com
        description: API URL for the current stage
        secure: false

  # Any other plugin config — additionalProperties is true on `custom`
  myProjectFlags:
    enableExperimentalThing: true

functions:
  hello:
    handler: src/hello.handler

# serverless-step-functions plugin
stepFunctions:
  validate: true
  noOutput: false
  stateMachines:
    orderProcessing:
      name: ${self:service}-${sls:stage}-orderProcessing
      role: arn:aws:iam::123456789012:role/sfn-execution
      tracingConfig:
        enabled: true
      tags:
        owner: orders-team
      events:
        - schedule:
            rate: rate(1 hour)
            enabled: true
      definition:
        Comment: Order processing state machine
        StartAt: Validate
        States:
          Validate:
            Type: Task
            Resource:
              Fn::GetAtt:
                - HelloLambdaFunction
                - Arn
            Next: Notify
            Retry:
              - ErrorEquals:
                  - States.ALL
                IntervalSeconds: 2
                MaxAttempts: 3
                BackoffRate: 2
          Notify:
            Type: Task
            Resource: arn:aws:states:::sns:publish
            Parameters:
              TopicArn: arn:aws:sns:us-east-1:123456789012:order-events
              Message.$: $
            End: true
  activities:
    - manualApproval
